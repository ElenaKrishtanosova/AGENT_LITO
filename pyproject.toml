[project]
name = "agent-lito"
version = "0.1.0"
description = "LangGraph чат-бот с поиском ресурсов в БД и интернете"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=0.1.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    "openai>=1.0.0",
    "pyodbc>=5.0.0",
    "sqlalchemy>=2.0.0",
    "azure-identity>=1.15.0",
    "numpy>=1.24.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.27.0",
    "tavily-python>=0.3.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "streamlit>=1.28.0",
    "psutil>=5.9.0",
]
readme = "README.md"
requires-python = ">= 3.9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
